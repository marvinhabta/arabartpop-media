name: Arab ARTPOP scheduler
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduler
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scheduler/post.py
      - name: Save posting log
        if: always()
        run: |
          git config user.name "arabartpop-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add scheduler/posted.json
          git diff --cached --quiet || (git commit -m "Scheduler: update posting log" && git push)
